name: remember
description: "Remember - Personal Reminder App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.21
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1
  speech_to_text: ^7.0.0
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  home_widget: ^0.6.0
  workmanager: ^0.5.2
  intl: ^0.19.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
